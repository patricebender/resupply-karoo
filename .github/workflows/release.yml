name: Release extension

# Semantic versioning via release-please (Conventional Commits).
#
# Flow: feat:/fix: commits on main -> release-please maintains a "Release PR"
# that bumps versionName in extension/app/build.gradle.kts + CHANGELOG. Merging
# that PR creates the tag `vX.Y.Z` + a GitHub Release, and this same
# run then builds the APK and attaches it to that release.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny-all by default; the release job opts into exactly what it needs below.
permissions: {}

# Serialize release runs so a fast follow-up push can't race the release PR.
concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # Scopes the environment's PLACES_API_KEY secret to this job (injected into the
    # Build APK step). release-please runs on every main push; only the merged release
    # PR builds the APK, so any environment protection rules gate those pushes too.
    environment: production

    permissions:
      contents: write        # create releases + tags
      pull-requests: write   # maintain the release PR
      packages: read         # read karoo-ext from GitHub Packages via GITHUB_TOKEN
    steps:
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below only runs when a Release PR was just merged.
      - name: Checkout
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Verify the published region files match the app's schema before we bundle any of
      # them. A stale regions release (older schema) fails here so we never ship an APK
      # whose seed the app would reject.
      - name: Check regions schema
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p seed
          gh release download regions-latest --pattern 'manifest.json' --dir seed --clobber
          SCHEMA="$(jq -r '.schemaVersion' seed/manifest.json)"
          APP_VER="$(grep -oP 'BUNDLED_DB_VERSION\s*=\s*\K[0-9]+' \
            extension/app/src/main/kotlin/io/resupply/karoo/data/PoiDatabase.kt)"
          echo "regions release schemaVersion=$SCHEMA, app BUNDLED_DB_VERSION=$APP_VER"
          if [[ "$SCHEMA" != "$APP_VER" ]]; then
            echo "::error::regions-latest is schema v$SCHEMA but the app expects v$APP_VER." \
              "Re-run the 'Build region files' workflow (all) to publish v$APP_VER, then release." >&2
            exit 1
          fi
          echo "REGIONS_SCHEMA=$SCHEMA" >> "$GITHUB_ENV"

      - name: Rasterize library icon
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 512 -h 512 \
            extension/app/resupply-icon.svg -o extension/app/resupply.png
          ls -la extension/app/resupply.png

      # Build and publish all three editions: same app + same version/changelog, differing
      # only in bundled POI data. Each is a separate GitHub release + Karoo library entry
      # (distinct applicationId per flavor), so a rider installs whichever suits them:
      #   lean       — no bundled data, download every region on demand
      #   coreEurope — germany+france+italy+belgium+netherlands+luxembourg bundled
      #   usa        — usa (all states) bundled
      # Each edition's release is tagged <extension-tag>-<edition>.
      - name: Build + publish editions
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        working-directory: extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ github.run_number }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Manifest is path-scoped (package "extension"); the tag output is namespaced.
          BASE_TAG: ${{ steps.rp.outputs['extension--tag_name'] }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SCHEMA="$REGIONS_SCHEMA"

          # Assemble one edition's seed asset into its flavor source set from the published
          # region files. usa is a single Complete file; coreEurope merges its 6 countries
          # (poi-only dedup, mirroring build-seed-set.sh); lean bundles nothing.
          seed_edition() {
            local edition="$1"; shift
            local flavor_dir="app/src/$edition/assets"
            mkdir -p "$flavor_dir"
            case "$edition" in
              lean) echo "lean: no bundled seed"; return 0 ;;
              usa) local ids=(usa); local out="$flavor_dir/pois-usa.sqlite" ;;
              coreEurope)
                local ids=(germany france italy belgium netherlands luxembourg)
                local out="$flavor_dir/pois-core-europe.sqlite" ;;
              *) echo "::error::unknown edition $edition" >&2; return 1 ;;
            esac
            mkdir -p seed
            for id in "${ids[@]}"; do
              gh release download regions-latest --repo "$REPO" \
                --pattern "${id}-v${SCHEMA}.sqlite.gz" --dir seed --clobber
              gunzip -c "seed/${id}-v${SCHEMA}.sqlite.gz" > "seed/${id}.sqlite"
            done
            # Single region → just use it; multiple → offset-merge poi rows + dedup osm_id.
            cp "seed/${ids[0]}.sqlite" "$out"
            local ver; ver="$(sqlite3 "$out" 'PRAGMA user_version;')"
            for id in "${ids[@]:1}"; do
              local off; off="$(sqlite3 "$out" 'SELECT COALESCE(MAX(id),0) FROM poi;')"
              sqlite3 "$out" "ATTACH 'seed/${id}.sqlite' AS r; BEGIN; \
                INSERT INTO poi (id,osm_id,lat,lng,type,category,name,tags,region_id) \
                SELECT id+$off,osm_id,lat,lng,type,category,name,tags,region_id FROM r.poi; \
                COMMIT; DETACH r;"
            done
            if [[ ${#ids[@]} -gt 1 ]]; then
              sqlite3 "$out" "DELETE FROM poi WHERE id NOT IN (SELECT MIN(id) FROM poi GROUP BY osm_id);"
            fi
            sqlite3 "$out" "VACUUM; PRAGMA user_version=$ver;"
            echo "seeded $edition: $(sqlite3 "$out" 'SELECT COUNT(*) FROM poi;') POIs (schema $ver)"
          }

          # Capitalize the flavor for the gradle task name (coreEurope -> CoreEurope).
          cap() { printf '%s' "$(tr '[:lower:]' '[:upper:]' <<<"${1:0:1}")${1:1}"; }

          for edition in lean coreEurope usa; do
            echo "::group::edition $edition"
            TAG="${BASE_TAG}-${edition}"
            BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

            # Restore a clean AndroidManifest ($BASE_URL$ placeholder) before each build,
            # since generateManifest substitutes it in place per edition.
            git checkout -- app/src/main/AndroidManifest.xml

            seed_edition "$edition"

            EDITION="$edition" BASE_URL="$BASE_URL" \
              ./gradlew :app:generateManifest ":app:assemble$(cap "$edition")Release" --no-daemon

            APK="app/build/outputs/apk/$edition/release/app-$edition-release.apk"
            cp "$APK" "app-release.apk"
            cp "app-release.apk" "resupply-${TAG}.apk"

            # Each edition gets its own release at its tag on this commit (same version +
            # changelog for all three); create it if a re-run hasn't already.
            if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" \
                --title "Resupply ${edition} ${BASE_TAG}" \
                --notes "Resupply ${edition} edition, ${BASE_TAG}. See the ${BASE_TAG} release for the changelog."
            fi

            # Library update fetches fixed names (app-release.apk, manifest.json, resupply.png)
            # at each edition's release download path; the versioned copy is for humans.
            ASSETS=(app-release.apk "resupply-${TAG}.apk" app/manifest.json)
            [ -f app/resupply.png ] && ASSETS+=(app/resupply.png)
            for shot in app/preview*.png; do [ -e "$shot" ] && ASSETS+=("$shot"); done
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$REPO" --clobber
            rm -f app-release.apk "resupply-${TAG}.apk"
            echo "::endgroup::"
          done
