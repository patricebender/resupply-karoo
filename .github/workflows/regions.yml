name: Build region files

# Builds the downloadable POI region files (per-Bundesland / per-country / per-state SQLite) and
# publishes them + the manifest to the `regions-latest` GitHub Release, which the app's
# RegionCatalogClient.MANIFEST_URL points at.
#
# Always rebuilds the ENTIRE catalog (no subset), in three tiers so the many-GB of Geofabrik
# downloads run in parallel instead of one long sequential loop:
#   1. build-leaves    — matrix: every single-extract region, sharded across runners.
#   2. build-composites — Germany/USA/Canada Complete, MERGED from the built leaf files (no
#                         re-download); semantically identical to a from-scratch build.
#   3. publish         — gather all region files, emit the manifest, upload to the release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish assets to.
        type: string
        default: regions-latest

permissions: {}

# One region build at a time — they all publish to the same release.
concurrency:
  group: build-regions
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------------------------
  # Tier 0: compute the leaf build matrix (round-robin shards) from the catalog.
  # ---------------------------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.shard.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/tools/poi-db/package-lock.json
      - name: Install pipeline deps
        working-directory: extension/tools/poi-db
        run: npm ci
      - name: Compute shards
        id: shard
        working-directory: extension/tools/poi-db
        # ~10 shards keeps us well under the public-repo 20-concurrent-job cap while batching
        # ~12 leaves per runner so each amortizes checkout+npm ci over many regions.
        run: echo "shards=$(npx --yes tsx regions.ts shards 10)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------
  # Tier 1: build every leaf region in parallel. Each shard uploads its dist files as an artifact.
  # ---------------------------------------------------------------------------------------------
  build-leaves:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install osmium + sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool sqlite3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # better-sqlite3 v11 aborts on Node 24 at teardown
          cache: npm
          cache-dependency-path: extension/tools/poi-db/package-lock.json
      - name: Install pipeline deps
        working-directory: extension/tools/poi-db
        run: npm ci
      - name: Build leaf regions
        working-directory: extension/tools/poi-db
        run: |
          set -euo pipefail
          for id in ${{ join(matrix.shard, ' ') }}; do
            echo "==> build-region-file.sh $id"
            ./build-region-file.sh "$id"
          done
          ls -lh dist/
      - name: Upload leaf artifacts
        uses: actions/upload-artifact@v4
        with:
          # A unique name per shard; the merge/publish jobs pull them all with a pattern.
          name: regions-leaf-${{ strategy.job-index }}
          path: extension/tools/poi-db/dist/*.sqlite.gz
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------------------------
  # Tier 2: assemble Germany/USA/Canada Complete by MERGING the built leaf files (no download).
  # ---------------------------------------------------------------------------------------------
  build-composites:
    needs: build-leaves
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/tools/poi-db/package-lock.json
      - name: Install pipeline deps
        working-directory: extension/tools/poi-db
        run: npm ci
      - name: Download leaf files
        uses: actions/download-artifact@v4
        with:
          pattern: regions-leaf-*
          merge-multiple: true
          path: extension/tools/poi-db/dist
      - name: Build composite regions
        working-directory: extension/tools/poi-db
        run: |
          set -euo pipefail
          for id in $(npx --yes tsx regions.ts composites); do
            echo "==> build-composite.sh $id"
            ./build-composite.sh "$id"
          done
          ls -lh dist/*.sqlite.gz
      - name: Upload composite artifacts
        uses: actions/upload-artifact@v4
        with:
          name: regions-composite
          # Only the composite files this job just built (the leaves are already uploaded).
          path: |
            extension/tools/poi-db/dist/germany-v*.sqlite.gz
            extension/tools/poi-db/dist/usa-v*.sqlite.gz
            extension/tools/poi-db/dist/canada-v*.sqlite.gz
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------------------------
  # Tier 3: gather every region file, emit the manifest, verify the app catalog, publish.
  # ---------------------------------------------------------------------------------------------
  publish:
    needs: build-composites
    runs-on: ubuntu-latest
    permissions:
      contents: write # (re)create the release + upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/tools/poi-db/package-lock.json
      - name: Install pipeline deps
        working-directory: extension/tools/poi-db
        run: npm ci
      - name: Download all region files
        uses: actions/download-artifact@v4
        with:
          pattern: regions-*
          merge-multiple: true
          path: extension/tools/poi-db/dist
      - name: Emit manifest + refresh app catalog
        working-directory: extension/tools/poi-db
        env:
          REGIONS_BASE_URL: >-
            https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag }}/
          # Every full rebuild ships fresher data → stamp every region with a monotonically
          # increasing dataVersion (the run number) so installed devices see "Update available".
          REGION_DATA_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          echo "---- region files ----"; ls -lh dist/*.sqlite.gz
          # Regenerate the app-facing catalog (label+group), then the manifest over dist/. A full
          # rebuild, so no prior manifest to merge — build-manifest.ts scans dist/ fresh.
          npx --yes tsx regions.ts app-json > ../../app/src/main/assets/regions.json
          npx --yes tsx build-manifest.ts
          echo "---- manifest ----"; cat dist/manifest.json
      - name: Verify regions.json is committed and in sync
        working-directory: extension/tools/poi-db
        run: |
          if ! git diff --quiet -- ../../app/src/main/assets/regions.json; then
            echo "::error::assets/regions.json is out of date. Run 'npm run gen:regions-json' and commit it." >&2
            git --no-pager diff -- ../../app/src/main/assets/regions.json
            exit 1
          fi
      - name: Publish to release
        working-directory: extension/tools/poi-db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # Full-catalog rebuild: recreate the release cleanly so no stale asset lingers from a
          # region that was removed from the catalog. (Was cumulative; now every run is complete.)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --title "POI regions" \
            --notes "Downloadable POI region files for the in-app region picker, built from Geofabrik extracts."
          gh release upload "$TAG" dist/*.sqlite.gz dist/manifest.json --clobber
