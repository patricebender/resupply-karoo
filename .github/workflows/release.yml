name: Release extension

# Semantic versioning via release-please (Conventional Commits).
#
# Flow: feat:/fix: commits on main -> release-please maintains a "Release PR"
# that bumps versionName in extension/app/build.gradle.kts + CHANGELOG. Merging
# that PR creates the tag `vX.Y.Z` + a GitHub Release, and this same
# run then builds the APK and attaches it to that release.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny-all by default; the release job opts into exactly what it needs below.
permissions: {}

# Serialize release runs so a fast follow-up push can't race the release PR.
concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # Scopes the environment's PLACES_API_KEY secret to this job (injected into the
    # Build APK step). release-please runs on every main push; only the merged release
    # PR builds the APK, so any environment protection rules gate those pushes too.
    environment: production

    permissions:
      contents: write        # create releases + tags
      pull-requests: write   # maintain the release PR
      packages: read         # read karoo-ext from GitHub Packages via GITHUB_TOKEN
    steps:
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below only runs when a Release PR was just merged.
      - name: Checkout
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rasterize library icon
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 512 -h 512 \
            extension/app/resupply-icon.svg -o extension/app/resupply.png
          ls -la extension/app/resupply.png

      # One "Resupply" app: no bundled POI data — the rider downloads the regions they ride
      # on demand (fast, over WiFi). So there's no seed to fetch or schema-gate here; the
      # region files are gated on-device at download time against BUNDLED_DB_VERSION.
      - name: Build signed release APK
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        working-directory: extension
        env:
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ github.run_number }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.rp.outputs['extension--tag_name'] }}
        run: |
          ./gradlew :app:generateManifest :app:assembleRelease --no-daemon

      - name: Attach release assets
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rp.outputs['extension--tag_name'] }}
        run: |
          set -euo pipefail
          # The library update mechanism fetches assets by fixed name at the release's
          # download path (app-release.apk, manifest.json, resupply.png). Keep those names.
          cp extension/app/build/outputs/apk/release/app-release.apk app-release.apk
          # Also publish a versioned copy for humans sideloading from the releases page.
          cp app-release.apk "resupply-${TAG}.apk"
          ASSETS=(app-release.apk "resupply-${TAG}.apk" extension/app/manifest.json extension/app/resupply.png)
          for shot in extension/app/preview*.png; do
            [ -e "$shot" ] && ASSETS+=("$shot")
          done
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
