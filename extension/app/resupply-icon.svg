<?xml version="1.0" encoding="UTF-8"?>
<!--
  Canonical Resupply icon (512x512): dark squircle tile with the "R" letterform, the
  stepped route line (orange over a dark casing) and the three coloured waypoint dots.
  Source of truth for the app/extension vector (res/drawable/ic_resupply.xml) and for the
  library store icon PNG, which CI rasterizes from this file (see the "Rasterize library
  icon" step in the release workflow). Keep this in sync with ic_resupply.xml if the
  artwork changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs><clipPath id="c1"><rect x="0" y="0" width="512" height="512" rx="116"/></clipPath></defs>
