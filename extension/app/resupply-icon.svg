  <g clip-path="url(#c1)" opacity="0.5">
    <path d="M-40 452 C 90 400 150 470 300 402 S 470 330 560 360" fill="none" stroke="#2A3A36" stroke-width="8"/>
    <path d="M-40 512 C 90 460 150 530 300 462 S 470 390 560 420" fill="none" stroke="#2A3A36" stroke-width="8"/>
  </g>
  <path fill-rule="evenodd" fill="#F2EDE3" transform="translate(157 118) scale(1.054)" d="M0 0 H58 V260 H0 Z M58 0 H120 A68 68 0 0 1 120 136 H58 Z M58 46 H120 A22 22 0 0 1 120 90 H58 Z M104 136 H164 L188 260 H128 Z"/>
  <path d="M52 404 L152 404 L228 282 L332 282 L398 152 L462 152" fill="none" stroke="#0F1A18" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 404 L152 404 L228 282 L332 282 L398 152 L462 152" fill="none" stroke="#E8873B" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#0F1A18" stroke-width="12">
