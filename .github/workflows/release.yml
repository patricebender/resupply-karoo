name: Release extension

# Semantic versioning via release-please (Conventional Commits).
#
# Flow: feat:/fix: commits on main -> release-please maintains a "Release PR"
# that bumps versionName in extension/app/build.gradle.kts + CHANGELOG. Merging
# that PR creates the tag `vX.Y.Z` + a GitHub Release, and this same
# run then builds the APK and attaches it to that release.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny-all by default; the release job opts into exactly what it needs below.
permissions: {}

# Serialize release runs so a fast follow-up push can't race the release PR.
concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # Scopes the environment's PLACES_API_KEY secret to this job (injected into the
    # Build APK step). release-please runs on every main push; only the merged release
    # PR builds the APK, so any environment protection rules gate those pushes too.
    environment: production

    permissions:
      contents: write        # create releases + tags
      pull-requests: write   # maintain the release PR
      packages: read         # read karoo-ext from GitHub Packages via GITHUB_TOKEN
    steps:
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below only runs when a Release PR was just merged.
      - name: Checkout
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Bundle the POI seed (full Germany) into the APK. It's the R*Tree-stripped Germany
      # region file the picker downloads, published (gzipped) on the regions release —
      # pulled here rather than rebuilt from OSM. Its schemaVersion must equal the app's
      # BUNDLED_DB_VERSION; a stale regions release (older schema) fails the build so we
      # never ship an APK whose seed the app would reject.
      #
      # Gunzip it to a plain .sqlite: the app opens `pois-germany.sqlite` (SEED_ASSET), and
      # AGP's asset merger would auto-inflate + rename a `.gz` asset anyway. Decompress
      # explicitly so the asset name is honest and doesn't depend on that quirk.
      - name: Fetch Germany seed asset
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p seed
          gh release download regions-latest --pattern 'manifest.json' --dir seed --clobber
          SCHEMA="$(jq -r '.schemaVersion' seed/manifest.json)"
          APP_VER="$(grep -oP 'BUNDLED_DB_VERSION\s*=\s*\K[0-9]+' \
            extension/app/src/main/kotlin/io/resupply/karoo/data/PoiDatabase.kt)"
          echo "regions release schemaVersion=$SCHEMA, app BUNDLED_DB_VERSION=$APP_VER"
          if [[ "$SCHEMA" != "$APP_VER" ]]; then
            echo "::error::regions-latest is schema v$SCHEMA but the app expects v$APP_VER." \
              "Re-run the 'Build region files' workflow (all) to publish v$APP_VER, then release." >&2
            exit 1
          fi
          gh release download regions-latest \
            --pattern "germany-v${SCHEMA}.sqlite.gz" --dir seed --clobber
          gunzip -c "seed/germany-v${SCHEMA}.sqlite.gz" \
            > extension/app/src/main/assets/pois-germany.sqlite
          ls -la extension/app/src/main/assets/pois-germany.sqlite

      - name: Build signed release APK
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        working-directory: extension
        env:
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
          # Monotonic Android versionCode; versionName comes from release-please.
          VERSION_CODE: ${{ github.run_number }}
          # Google Places key for the on-demand "check hours on Google" fallback.
          # Without it BuildConfig.PLACES_API_KEY is empty and the feature is disabled,
          # leaving POIs without OSM hours with a bare detail page.
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          # Release signing. When these are set, build.gradle.kts signs `release` with the
          # stable store key; unset, it would fall back to debug (never for a real release).
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Karoo library manifest: release-asset download prefix. generateManifest writes
          # this into manifest.json and substitutes $BASE_URL$ in the merged AndroidManifest.
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.rp.outputs['extension--tag_name'] }}
        run: |
          # generateManifest runs automatically as a dependency of the manifest-merge task,
          # but invoke it explicitly so manifest.json is emitted even if that wiring changes.
          ./gradlew :app:generateManifest :app:assembleRelease --no-daemon

      - name: Rasterize library icon
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 512 -h 512 \
            extension/app/resupply-icon.svg -o extension/app/resupply.png
          ls -la extension/app/resupply.png

      - name: Attach release assets
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Manifest is path-scoped (package "extension"), so the tag output is
          # namespaced per path — the bare `tag_name` output is empty here.
          TAG: ${{ steps.rp.outputs['extension--tag_name'] }}
        run: |
          set -euo pipefail
          # The library update mechanism fetches assets by fixed name at the release's
          # download path (app-release.apk, manifest.json, resupply.png). Keep those names.
          cp extension/app/build/outputs/apk/release/app-release.apk app-release.apk
          # Also publish a versioned copy for humans sideloading from the releases page.
          cp app-release.apk "resupply-${TAG}.apk"
          ASSETS=(app-release.apk "resupply-${TAG}.apk" extension/app/manifest.json extension/app/resupply.png)
          # Screenshots are optional; include any that were committed next to the module.
          for shot in extension/app/preview*.png; do
            [ -e "$shot" ] && ASSETS+=("$shot")
          done
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
